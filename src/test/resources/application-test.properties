# Profile "test": sobrescreve só o que muda em relação ao application.properties principal.
# createDatabaseIfNotExist=true faz o driver criar o banco fitzone_test na primeira execução;
# o Flyway cria as tabelas. Usuário e senha continuam vindo do .env.
spring.datasource.url=jdbc:mysql://localhost:3306/fitzone_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo

# SQL no console polui a saída dos testes
spring.jpa.show-sql=false