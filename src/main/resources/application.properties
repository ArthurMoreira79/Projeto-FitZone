spring.application.name=fitzone

# Importa as variáveis do arquivo .env da raiz do projeto
spring.config.import=optional:file:.env[.properties]

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fitzone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Só o Flyway altera o banco; o Hibernate apenas confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado no console (útil enquanto aprende; desligue depois se poluir demais)
spring.jpa.show-sql=true